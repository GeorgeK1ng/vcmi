name: Weekly Qt translation refresh

on:
  schedule:
    # Runs Sunday 23:30 UTC = Monday 00:30 (CET) / 01:30 (CEST) in Prague
    - cron: "30 23 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode: 'pr' opens a pull request, 'push' commits to the current branch"
        required: false
        default: "pr"

permissions:
  contents: write
  pull-requests: write

env:
  # Default mode for scheduled runs; manual runs can override to 'push'
  UPDATE_MODE: ${{ github.event.inputs.mode || 'pr' }}
  CURRENT_BRANCH: ${{ github.ref_name }}

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt tools (lupdate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qttools5-dev-tools

      # --- Run lupdate in both subprojects ---
      - name: Update TS files (Launcher)
        working-directory: launcher
        run: |
          # Update all TS files; remove obsolete entries
          lupdate -no-obsolete . -ts translation/*.ts

      - name: Update TS files (Map Editor)
        working-directory: mapeditor
        run: |
          lupdate -no-obsolete . -ts translation/*.ts

      # --- Diagnostics: show what changed after lupdate ---
      - name: Show changed files
        run: |
          echo "Changed files (working tree):"
          git status --porcelain || true
          echo
          echo "Diff names (unstaged):"
          git diff --name-only || true

      # --- Stage only translation files from both apps ---
      - name: Stage translation changes explicitly
        run: |
          git add launcher/translation/**/*.ts mapeditor/translation/**/*.ts || true
          echo "Staged for commit:"
          git diff --cached --name-only || true

      # --- Decide if we have anything to commit/PR ---
      - name: Detect staged changes
        id: staged
        run: |
          COUNT=$(git diff --cached --name-only | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No staged translation changes."
          else
            echo "Staged $COUNT file(s)."
          fi

      # --- PUSH MODE: commit directly to the branch that triggered the workflow ---
      - name: Commit and push changes (push mode)
        if: ${{ steps.staged.outputs.count != '0' && env.UPDATE_MODE == 'push' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(translations): update Qt .ts for Launcher & Map Editor"
          branch: ${{ env.CURRENT_BRANCH }}
          # We rely on previously staged files; no file_pattern here.

      # --- PR MODE: open a PR into the branch that triggered the workflow ---
      - name: Create/Update Pull Request (pr mode)
        if: ${{ steps.staged.outputs.count != '0' && env.UPDATE_MODE == 'pr' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(translations): update Qt .ts for Launcher & Map Editor"
          branch: chore/qt-ts-refresh-${{ env.CURRENT_BRANCH }}      # source branch created from CURRENT_BRANCH
          base: ${{ env.CURRENT_BRANCH }}                            # PR targets CURRENT_BRANCH
          title: "Weekly Qt translations refresh (${{ env.CURRENT_BRANCH }})"
          body: |
            Automated refresh of Qt `.ts` files for **Launcher** and **Map Editor** on branch `${{ env.CURRENT_BRANCH }}`.

            **What this does**
            - Runs: `lupdate -no-obsolete . -ts translation/*.ts`
            - Removes obsolete entries
            - Adds new strings found in source

            To keep obsolete entries, remove `-no-obsolete` in the workflow.
          delete-branch: true
          # Limit files included in the PR commit to the translations we staged
          add-paths: |
            launcher/translation/**/*.ts
            mapeditor/translation/**/*.ts

      - name: No-op summary
        if: ${{ steps.staged.outputs.count == '0' }}
        run: echo "No translation changes detected; nothing to commit or PR."
