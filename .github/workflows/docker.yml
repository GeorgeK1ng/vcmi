name: Build Portmaster

on:
  push:
    branches:
      - beta
      - master
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": { "containerd-snapshotter": true }
            }

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Image
        uses: docker/build-push-action@v2
        with:
          file: docker/BuildPortmaster-aarch64.dockerfile
          context: .
          tags: vcmi-portmaster-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build VCMI
        shell: bash
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/vcmi" \
            -w /vcmi \
            vcmi-portmaster-build \
            bash -s <<'BASH'
          set -euo pipefail
          rm -rf out/build/portmaster-release
          cmake -S . -B out/build/portmaster-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_STRICT_COMPILATION=OFF \
            -DFORCE_BUNDLED_FL=ON \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS -Wno-error -Wno-error=maybe-uninitialized -Wno-error=array-bounds"
          ninja -C out/build/portmaster-release vcmiclient

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vcmi-portmaster/libs
          sudo mv ./out/build/portmaster-release/bin/*so* vcmi-portmaster/libs/ || true

          mkdir -p vcmi-portmaster/libs/AI
          sudo mv ./out/build/portmaster-release/bin/AI/*so* vcmi-portmaster/libs/AI/ || true

          mkdir -p vcmi-portmaster/bin
          sudo mv ./out/build/portmaster-release/bin/vcmi* vcmi-portmaster/bin/ || true

          cp -r ./Mods vcmi-portmaster/Mods
          cp -r ./config vcmi-portmaster/config

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcmi-portmaster
          path: vcmi-portmaster
