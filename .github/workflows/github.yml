name: VCMI

on:
  push:
    branches:
      - beta
      - master
      - develop
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  validate-code:
    name: Validate Code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure LF line endings
        run: |
          find . -path ./.git -prune -o -type f \
          -not -name '*.png' -and -not -name '*.ttf' -print0 | \
          { ! xargs -0 grep -l -z -P '\r\n'; }

      - name: Validate JSON
        run: |
          pip install jstyleson
          python3 CI/validate_json.py

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: 'CI/example.markdownlint-cli2.jsonc'
          globs: |
            '**/*.md'
          ignore: |
            AI/FuzzyLite/**
            test/googletest/**
            osx/**

  windows-msvc:
    name: Build MSVC Windows ${{ matrix.arch }}
    needs: validate-code
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            preset: windows-msvc-release
          - arch: x86
            preset: windows-msvc-release-x86
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        run: CI/before_install/msvc.sh
        shell: bash
        env:
          VCMI_BUILD_PLATFORM: ${{ matrix.arch }}

      - name: Ensure Inno Setup 6 is available
        run: |
          $defaultPath = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $defaultPath)) {
            Write-Host "Inno Setup 6 not found. Installing via winget..."
            winget install --id JRSoftware.InnoSetup -e -s winget -i
          } else {
            Write-Host "Found Inno Setup 6 at: $defaultPath"
          }
          $innoBin = Split-Path "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          echo $innoBin | Out-File -Append -FilePath $env:GITHUB_PATH
        shell: pwsh

      - name: Extract version info
        id: version
        run: |
          MAJOR=$(grep 'VCMI_VERSION_MAJOR' vcmi/cmake_modules/VersionDefinition.cmake | grep -o '[0-9]\+')
          MINOR=$(grep 'VCMI_VERSION_MINOR' vcmi/cmake_modules/VersionDefinition.cmake | grep -o '[0-9]\+')
          PATCH=$(grep 'VCMI_VERSION_PATCH' vcmi/cmake_modules/VersionDefinition.cmake | grep -o '[0-9]\+')
          VERS="$MAJOR.$MINOR.$PATCH"
          DATE=$(date +"%Y%m%d%H%M%S")
          echo "VERSION=$VERS.$DATE" >> $GITHUB_ENV
          echo "SHORT_VERSION=$VERS" >> $GITHUB_ENV

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Installer Script
        run: |
          cmd /c CI\wininstaller\build_installer.cmd ^
            "%VERSION%" ^
            "%GITHUB_RUN_ID%" ^
            "${{ matrix.arch }}" ^
            "VCMI"

      - name: Upload Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: |
            **/Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: vcmi-${{ matrix.arch }}-symbols
          compression-level: 9
          path: |
            ${{ github.workspace }}/**/*.pdb
