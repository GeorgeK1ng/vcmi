name: VCMI

on:
  push:
    branches:
      - beta
      - master
      - develop
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  validate-code:
    name: Validate Code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure LF line endings
        run: |
          find . -path ./.git -prune -o -type f \
          -not -name '*.png' -and -not -name '*.ttf' -print0 | \
          { ! xargs -0 grep -l -z -P '\r\n'; }

      - name: Validate JSON
        run: |
          pip install jstyleson
          python3 CI/validate_json.py

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: 'CI/example.markdownlint-cli2.jsonc'
          globs: |
            '**/*.md'
          ignore: |
            AI/FuzzyLite/**
            test/googletest/**
            osx/**

  windows-msvc:
    name: Build MSVC Windows ${{ matrix.arch }}
    needs: validate-code
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            preset: windows-msvc-release
          - arch: x86
            preset: windows-msvc-release-x86
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        run: CI/before_install/msvc.sh
        shell: bash
        env:
          VCMI_BUILD_PLATFORM: ${{ matrix.arch }}

      - name: Ensure Inno Setup 6 is available
        run: |
          $defaultPath = "$env:ProgramFiles`(x86`)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $defaultPath)) {
            Write-Host "Inno Setup 6 not found. Downloading and installing..."
            $installArgs = @("/VERYSILENT", "/NORESTART", "/DIR=C:\Program Files (x86)\Inno Setup 6")
            Invoke-WebRequest -Uri "https://files.innosetup.nl/innosetup-6.4.3.exe" -OutFile "isetup.exe"
            Start-Process -FilePath "isetup.exe" -ArgumentList $installArgs -Wait
          } else {
            Write-Host "Found Inno Setup 6 at: $defaultPath"
          }
          $innoBin = Split-Path $defaultPath
          Add-Content -Path $env:GITHUB_PATH -Value $innoBin
        shell: pwsh

      - name: Extract version info
        id: version
        run: |
          $content = Get-Content vcmi/cmake_modules/VersionDefinition.cmake
          $major = ($content | Select-String 'VCMI_VERSION_MAJOR' | Select-String -Pattern '\d+' -AllMatches).Matches.Value
          $minor = ($content | Select-String 'VCMI_VERSION_MINOR' | Select-String -Pattern '\d+' -AllMatches).Matches.Value
          $patch = ($content | Select-String 'VCMI_VERSION_PATCH' | Select-String -Pattern '\d+' -AllMatches).Matches.Value
          $version = "$major.$minor.$patch"
          $timestamp = Get-Date -Format "yyyyMMddHHmmss"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version.$timestamp"
          Add-Content -Path $env:GITHUB_ENV -Value "SHORT_VERSION=$version"
        shell: pwsh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Installer Script
        run: |
          cmd /c CI\wininstaller\build_installer.cmd ^
            "%VERSION%" ^
            "%GITHUB_RUN_ID%" ^
            "${{ matrix.arch }}" ^
            "VCMI"

      - name: Upload Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: |
            **/Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: vcmi-${{ matrix.arch }}-symbols
          compression-level: 9
          path: |
            ${{ github.workspace }}/**/*.pdb
