name: VCMI

on:
  push:
    branches:
      - beta
      - master
      - develop
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-24.04
    outputs:
      version_timestamp: ${{ steps.extract.outputs.version_timestamp }}
      short_version: ${{ steps.extract.outputs.short_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: extract
        shell: pwsh
        run: |
          $filePath = "$env:GITHUB_WORKSPACE/cmake_modules/VersionDefinition.cmake"
          if (!(Test-Path $filePath)) {
            Write-Host "File not found: $filePath"
            exit 1
          }

          $content = Get-Content $filePath -Raw

          $majorMatch = [regex]::Match($content, 'set\(VCMI_VERSION_MAJOR\s+(\d+)\)')
          $minorMatch = [regex]::Match($content, 'set\(VCMI_VERSION_MINOR\s+(\d+)\)')
          $patchMatch = [regex]::Match($content, 'set\(VCMI_VERSION_PATCH\s+(\d+)\)')

          if (!($majorMatch.Success -and $minorMatch.Success -and $patchMatch.Success)) {
            Write-Host "Failed to extract version numbers"
            exit 1
          }

          $shortVersion = "$($majorMatch.Groups[1].Value).$($minorMatch.Groups[1].Value).$($patchMatch.Groups[1].Value)"
          $timestamp = Get-Date -Format "yyyyMMddHHmmss"

          echo "version_timestamp=$timestamp" >> $env:GITHUB_OUTPUT
          echo "short_version=$shortVersion" >> $env:GITHUB_OUTPUT

  validate-code:
    name: Validate Code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure LF line endings
        run: |
          find . -path ./.git -prune -o -type f \
          -not -name '*.png' -and -not -name '*.ttf' -print0 | \
          { ! xargs -0 grep -l -z -P '\r\n'; }

      - name: Validate JSON
        run: |
          pip install jstyleson
          python3 CI/validate_json.py

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: 'CI/example.markdownlint-cli2.jsonc'
          globs: |
            '**/*.md'
          ignore: |
            AI/FuzzyLite/**
            test/googletest/**
            osx/**

  windows-msvc:
    name: Build MSVC Windows ${{ matrix.arch }}
    needs: [validate-code, extract-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch: [x64, x86, arm64]
        include:
          - arch: x64
            preset: windows-msvc-release
            runner: windows-latest
          - arch: x86
            preset: windows-msvc-release-x86
            runner: windows-latest
          - arch: arm64
            preset: windows-msvc-release-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        run: CI/before_install/msvc.sh
        shell: bash
        env:
          VCMI_BUILD_PLATFORM: ${{ matrix.arch }}

      - name: Ensure Inno Setup 6 is available
        run: |
          $defaultPath = "$env:ProgramFiles`(x86`)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $defaultPath)) {
            Write-Host "Inno Setup 6 not found. Downloading and installing..."
            $installArgs = @("/VERYSILENT", "/NORESTART", "/DIR=C:\\Program Files (x86)\\Inno Setup 6")
            Invoke-WebRequest -Uri "https://files.innosetup.nl/innosetup-6.4.3.exe" -OutFile "isetup.exe"
            Start-Process -FilePath "isetup.exe" -ArgumentList $installArgs -Wait
          } else {
            Write-Host "Found Inno Setup 6 at: $defaultPath"
          }
          $innoBin = Split-Path $defaultPath
          Add-Content -Path $env:GITHUB_PATH -Value $innoBin
        shell: pwsh

      - name: Install vcpkg Dependencies
        run: bash CI/install_vcpkg_dependencies.sh msvc-${{ matrix.arch }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Locate compiled binaries dynamically
        id: locate-bin
        run: |
          $searchRoot = "$env:GITHUB_WORKSPACE\out\build\${{ matrix.preset }}"
          Write-Host "Searching under: $searchRoot"

          $vcmiClient = Get-ChildItem -Path $searchRoot -Recurse -Filter vcmi_client.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vcmiClient) {
            Write-Host "ERROR: Could not locate vcmi_client.exe"
            exit 1
          }

          $binPath = Split-Path $vcmiClient.FullName
          Write-Host "Located bin directory: $binPath"
          echo "bin_path=$binPath" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Run Installer Script
        run: |
          cmd /c CI\wininstaller\build_installer.cmd ^
            "${{ needs.extract-version.outputs.short_version }}" ^
            "${{ needs.extract-version.outputs.version_timestamp }}" ^
            "${{ matrix.arch }}" ^
            "VCMI" ^
            "${{ steps.locate-bin.outputs.bin_path }}"
        shell: cmd

      - name: Upload Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: |
            **/Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: vcmi-${{ matrix.arch }}-symbols
          compression-level: 9
          path: |
            ${{ github.workspace }}/**/*.pdb
